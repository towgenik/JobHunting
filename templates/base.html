<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Job Agent{% endblock %}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <style>
    :root {
      --ctp-rosewater:  #dc8a78; --ctp-flamingo:  #dd7878; --ctp-pink:      #ea76cb;
      --ctp-mauve:      #8839ef; --ctp-red:       #d20f39; --ctp-maroon:    #e64553;
      --ctp-peach:      #fe640b; --ctp-yellow:    #df8e1d; --ctp-green:     #40a02b;
      --ctp-teal:       #179299; --ctp-sky:       #04a5e5; --ctp-sapphire:  #209fb5;
      --ctp-blue:       #1e66f5; --ctp-lavender:  #7287fd; --ctp-text:      #4c4f69;
      --ctp-subtext1:   #5c5f77; --ctp-subtext0:  #6c6f85; --ctp-overlay2:  #7c7f93;
      --ctp-overlay1:   #8c8fa1; --ctp-overlay0:  #9ca0b0; --ctp-surface2:  #acb0be;
      --ctp-surface1:   #bcc0cc; --ctp-surface0:  #ccd0da; --ctp-base:      #eff1f5;
      --ctp-mantle:     #e6e9ef; --ctp-crust:     #dce0e8;
    }
    :root {
      --text-primary:    var(--ctp-text);
      --text-secondary:  var(--ctp-subtext0);
      --accent:          var(--ctp-blue);
      --accent-text:     var(--ctp-base);
      --accent-hover:    var(--ctp-lavender);
      --accent-focus:    color-mix(in srgb, var(--ctp-blue) 25%, transparent);
      --surface-alt:     var(--ctp-mantle);
      --border-subtle:   var(--ctp-surface0);
      --bg-surface:      var(--ctp-base);
      --status-ok:       var(--ctp-green);
      --status-err:      var(--ctp-red);
      --status-ok-text:  var(--ctp-base);
      --status-err-text: var(--ctp-base);
    }
    html {
      --pico-primary:            #1e66f5;
      --pico-primary-hover:      #7287fd;
      --pico-primary-inverse:    #eff1f5;
      --pico-primary-focus:      color-mix(in srgb, #1e66f5 25%, transparent);
      --pico-background-color:   #eff1f5;
      --pico-color:              #4c4f69;
      --pico-muted-color:        #6c6f85;
      --pico-card-background-color: #e6e9ef;
      --pico-muted-border-color: #ccd0da;
    }
    body { background: var(--ctp-base); color: var(--ctp-text); }
    button, [role="button"], input[type="submit"], input, select, textarea, article {
      border-radius: 0 !important;
    }
    button, [role="button"], input[type="submit"] {
      padding: 0.25rem 0.6rem !important; font-size: 0.85rem !important;
      line-height: 1.3 !important;
      width: auto !important; min-height: 0 !important; height: auto !important;
    }
    input:not([type="submit"]):not([type="checkbox"]):not([type="radio"]),
    select, textarea {
      padding: 0.3rem 0.5rem !important; font-size: 0.85rem !important;
      line-height: 1.3 !important; min-height: 0 !important; height: auto !important;
    }
    input[type="checkbox"], input[type="radio"] {
      width: 1em !important; height: 1em !important;
      min-width: 1em !important; min-height: 1em !important;
      flex-shrink: 0 !important;
    }
    nav { padding: 0.2rem 0.8rem !important; }
    article { margin-bottom: 0.5rem !important; }
    :root {
      --pico-block-spacing-vertical: 0.5rem;
      --pico-spacing: 0.5rem;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2/dist/htmx.min.js"></script>
</head>
<body>
  <main class="container">
    <nav>
      <ul><li><strong>Job Agent</strong></li></ul>
      <ul>
        <li><a href="/">Jobs</a></li>
        <li><a href="/profile">Profile</a></li>
        <li><a href="/settings">Settings</a></li>
      </ul>
    </nav>
    {% block content %}{% endblock %}
  </main>
  <script>
    // Global SSE connection — shared by all pages to avoid connection limits.
    // Each page adds listeners to window.__sse instead of opening new connections.
    (function() {
      const source = new EventSource('/events');
      window.__sse = source;
      window.addEventListener('beforeunload', () => source.close());
      window.addEventListener('pagehide', () => source.close());

      // Job list refresh (jobs page only)
      let timer = null;
      const refreshList = () => {
        if (timer) return;
        timer = setTimeout(() => {
          timer = null;
          const list = document.getElementById('job-list');
          if (!list) return;
          const checkedIds = Array.from(list.querySelectorAll('.job-select:checked'))
            .map(cb => cb.value);
          fetch('/jobs/list')
            .then(r => r.text())
            .then(html => {
              list.innerHTML = html;
              checkedIds.forEach(id => {
                const cb = list.querySelector('.job-select[value="' + id + '"]');
                if (cb) cb.checked = true;
              });
            });
        }, 150);
      };
      source.addEventListener('job-update', refreshList);
      source.onerror = function() {};
    })();
  </script>
</body>
</html>
