{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<style>
  main.container { max-width:100%; padding:0; margin:0; display:flex; flex-direction:column; height:100vh }
  nav { padding:.4rem 1rem; flex-shrink:0; border-bottom:1px solid var(--border-subtle) }
  #toolbar { display:flex; gap:.4rem; align-items:center; padding:.3rem .5rem; border-bottom:1px solid var(--border-subtle); flex-shrink:0 }
  #toolbar button { font-size:.78rem; padding:.2rem .5rem }
  #toolbar .spacer { flex:1 }
  #workspace { flex:1; display:flex; overflow:hidden }
  /* Sidebar */
  #sidebar { width:180px; min-width:80px; overflow:auto; border-right:1px solid var(--border-subtle); padding:.4rem; flex-shrink:0 }
  #sidebar a { display:block; padding:.2rem .4rem; font-size:.82rem; text-decoration:none; color:var(--text-primary); border-radius:2px; cursor:pointer }
  #sidebar a:hover { background:var(--surface-alt) }
  #sidebar a.selected { background:var(--accent); color:var(--accent-text) }
  /* Editor */
  #editor-pane { flex:1; overflow:hidden; display:flex; flex-direction:column; background:var(--bg-surface) }
  #editor-row { display:flex; flex:1; overflow:hidden }
  #line-numbers { width:36px; text-align:right; padding:.6rem .4rem .6rem 0; font-family:monospace; font-size:.85rem; line-height:1.5; color:var(--text-secondary); overflow:hidden; background:var(--surface-alt); flex-shrink:0; user-select:none }
  #editor { flex:1; resize:none; font-family:monospace; font-size:.85rem; line-height:1.5; padding:.6rem; border:none; border-left:1px solid var(--border-subtle); outline:none; color:var(--text-primary); background:var(--bg-surface) }
  /* Preview */
  #preview-pane { flex:1; overflow:auto; padding:.5rem; display:flex; justify-content:center; background:var(--surface-alt) }
  #preview-wrap { position:relative; transform-origin:top left }
  .hidden-panel { display:none !important }
  /* Saved feedback */
  #save-status { font-size:.78rem; color:var(--text-secondary); min-width:120px }
</style>

<div id="toolbar">
  <button onclick="togglePanel('sidebar','btn-sidebar')" id="btn-sidebar">Files</button>
  <button onclick="togglePanel('editor-pane','btn-editor')" id="btn-editor">Editor</button>
  <button onclick="togglePanel('preview-pane','btn-preview')" id="btn-preview">Preview</button>
  <span class="spacer"></span>
  <span id="save-status"></span>
  <button onclick="saveProfile()">Save</button>
  <button class="outline" id="btn-pdf" onclick="window.open('/profile/print?file={{ current_file|urlencode }}','_blank')">Download PDF</button>
</div>

<div id="workspace">
  <div id="sidebar">
    <strong style="font-size:.78rem; padding:.2rem .4rem; display:block; color:var(--text-secondary)">Files</strong>
    {% for file in files %}
    <a hx-get="/profile/load?file={{ file.path|urlencode }}"
       hx-target="#editor-pane"
       hx-swap="innerHTML"
       hx-push-url="/profile?file={{ file.path|urlencode }}"
       class="{% if file.path == current_file %}selected{% endif %}"
       data-file="{{ file.path }}">{{ file.name }}</a>
    {% endfor %}
  </div>

  <div id="editor-pane">
    {% if is_locked %}
    <div id="lock-banner" style="padding:.3rem .6rem;background:var(--surface-alt);border-bottom:1px solid var(--border-subtle);font-size:.8rem;display:flex;align-items:center;gap:.5rem">
      <span style="color:var(--text-secondary)">Locked: this file is auto-generated by AI agents. Manual edits may be overwritten.</span>
      <button onclick="unlockEditor()" style="font-size:.78rem;padding:.15rem .4rem;margin:0">Edit anyway</button>
    </div>
    {% endif %}
    <div id="editor-row">
      <div id="line-numbers"></div>
      <textarea id="editor" name="content"{% if is_locked %} readonly{% endif %}
                hx-trigger="keyup changed delay:500ms"
                hx-post="/profile" hx-include="#file-field"
                hx-target="#save-status" hx-swap="innerHTML">{{ content }}</textarea>
      <input type="hidden" name="file" value="{{ current_file }}" id="file-field"
             data-locked="{% if is_locked %}1{% else %}0{% endif %}">
    </div>
  </div>

  <div id="preview-pane">
    <div id="preview-wrap">
      <iframe id="cv-frame" sandbox="allow-same-origin"
              style="border:none; width:794px; height:1122px; transform-origin:top left; background:white; display:block; margin:0 auto">
      </iframe>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  const PREVIEW_CSS = `
    @page { size:A4; margin:1.5cm }
    * { margin:0; padding:0; box-sizing:border-box }
    body {
      font-family:'Georgia','Times New Roman',serif;
      font-size:11pt; line-height:1.45; color:#222;
      width:calc(794px - 3cm); padding:1.5cm;
    }
    header { text-align:center; margin-bottom:1.5em; padding-bottom:1em; border-bottom:1.5px solid #333 }
    header .name { font-size:20pt; font-weight:700; letter-spacing:2pt; text-transform:uppercase; margin-bottom:.15em }
    header .title { font-size:11pt; color:#555; font-style:italic }
    h1 { font-size:14pt; margin:1.2em 0 .4em; border-bottom:1px solid #999; padding-bottom:.15em; text-transform:uppercase; letter-spacing:1pt }
    h2 { font-size:12pt; margin:1em 0 .3em; border-bottom:1px solid #ccc; padding-bottom:.1em; text-transform:uppercase; letter-spacing:.5pt }
    h3 { font-size:11pt; margin:.8em 0 .2em; font-weight:600 }
    h4 { font-size:10.5pt; margin:.6em 0 .15em; font-weight:600; font-style:italic }
    p  { margin:0 0 .5em; text-align:justify }
    ul { margin:0 0 .6em 1.2em; list-style:square }
    li { margin-bottom:.15em }
    strong { color:#111 }
  `;

  let editor = document.getElementById('editor');
  let lineNumbers = document.getElementById('line-numbers');
  const frame = document.getElementById('cv-frame');

  function showPageCount() {
    frame.onload = function() {
      const doc = frame.contentDocument;
      if (!doc) return;
      const h = doc.body.scrollHeight;
      const wrap = document.getElementById('preview-wrap');
      const scale = Math.min(1, (wrap.parentElement.clientWidth - 24) / 794);
      frame.style.transform = `scale(${scale})`;
      frame.style.height = (h * scale + 2) + 'px';
    };
    renderPreview();
  }

  function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML }

  function md2html(md) {
    let fm = {};
    let body = md;
    const m = md.match(/^---\n([\s\S]*?)\n---\n?/);
    if (m) {
      body = md.slice(m[0].length);
      let key = '', val = '';
      m[1].split('\n').forEach(line => {
        const fmkv = line.match(/^(\w+):\s*(.*)/);
        if (fmkv) {
          if (key) fm[key] = val;
          key = fmkv[1]; val = fmkv[2].trim();
          if ((val.startsWith('"') && val.endsWith('"')) ||
              (val.startsWith("'") && val.endsWith("'"))) {
            val = val.slice(1, -1);
          }
        } else if (key && line.startsWith('  - ')) {
          val += '\n' + line.trim();
        }
      });
      if (key) fm[key] = val;
    }
    let header = '';
    const name = fm['name'] || '';
    const title = fm['title'] || '';
    if (name || title) {
      header += '<header style="text-align:center;margin-bottom:1.2em">\n';
      if (name) header += `  <div style="font-size:18pt;font-weight:700;letter-spacing:1pt;text-transform:uppercase;margin-bottom:.2em">${esc(name)}</div>\n`;
      if (title) header += `  <div style="font-size:11pt;color:#555">${esc(title)}</div>\n`;
      header += '</header>\n';
    }
    body = body.replace(/<!--[\s\S]*?-->/g, '');
    body = body.replace(/\[\[[^\]]+\|([^\]]+)\]\]/g, '$1');
    body = body.replace(/\[\[([^\]]+)\]\]/g, '$1');
    return header + marked.parse(body);
  }

  // ponynail: immediate render (sets frame.srcdoc), debounced for input
  function renderPreview() {
    const ed = document.getElementById('editor');
    if (!ed) return;
    const rendered = md2html(ed.value);
    frame.srcdoc = `<!DOCTYPE html><html><head><style>${PREVIEW_CSS}</style></head><body>${rendered}</body></html>`;
  }

  let previewTimer = null;
  function debouncedPreview() {
    if (previewTimer) clearTimeout(previewTimer);
    previewTimer = setTimeout(() => { previewTimer = null; renderPreview(); showPageCount(); }, 250);
  }

  function updateLineNumbers() {
    const ed = document.getElementById('editor');
    const ln = document.getElementById('line-numbers');
    if (!ed || !ln) return;
    const lines = ed.value.split('\n');
    ln.innerHTML = lines.map((_, i) => `<span>${i+1}</span>`).join('<br>');
  }

  function syncScroll() {
    const ed = document.getElementById('editor');
    const ln = document.getElementById('line-numbers');
    if (ed && ln) ln.scrollTop = ed.scrollTop;
  }

  // Attach listeners to current editor element
  function attachEditorListeners() {
    const ed = document.getElementById('editor');
    if (!ed) return;
    ed.addEventListener('scroll', syncScroll);
    ed.addEventListener('input', () => {
      updateLineNumbers();
      syncScroll();
      debouncedPreview();
    });
  }

  attachEditorListeners();

  // Panel toggling
  let hiddenPanels = new Set();
  function togglePanel(id, btnId) {
    const el = document.getElementById(id);
    const btn = document.getElementById(btnId);
    if (el.classList.contains('hidden-panel')) {
      el.classList.remove('hidden-panel');
      btn.classList.remove('secondary');
      hiddenPanels.delete(id);
    } else {
      if (hiddenPanels.size >= 2) return; // Keep at least one panel visible
      el.classList.add('hidden-panel');
      btn.classList.add('secondary');
      hiddenPanels.add(id);
    }
    // Show page count when preview becomes visible
    if (id === 'preview-pane' && !el.classList.contains('hidden-panel')) {
      setTimeout(() => { showPageCount(); }, 100);
    }
  }

  // HTMX after-swap: re-init editor state when sidebar file-switch swaps the pane
  document.getElementById('editor-pane').addEventListener('htmx:afterSwap', function() {
    editor = document.getElementById('editor');
    lineNumbers = document.getElementById('line-numbers');
    attachEditorListeners();
    updateLineNumbers();
    syncScroll();
    // Reset lastSavedValue for new file
    lastSavedValue = (editor || {}).value || '';
    // Update sidebar selected class
    const fileField = document.getElementById('file-field');
    const currentFile = fileField ? fileField.value : '';
    document.querySelectorAll('#sidebar a').forEach(a => {
      a.classList.toggle('selected', a.dataset.file === currentFile);
    });
    // Update Download PDF button
    const pdfBtn = document.getElementById('btn-pdf');
    if (pdfBtn) pdfBtn.onclick = () => window.open('/profile/print?file=' + encodeURIComponent(currentFile), '_blank');
    // Dismiss any existing toast
    const existingToast = document.getElementById('profile-toast');
    if (existingToast) existingToast.remove();
    // Kick off preview render (debounced)
    debouncedPreview();
  });

  // Initial preview render — force re-render after iframe ready
  frame.srcdoc = '';
  requestAnimationFrame(() => {
    updateLineNumbers();
    renderPreview();
    setTimeout(showPageCount, 100);
  });

  function saveProfile() {
    const ed = document.getElementById('editor');
    const fileField = document.getElementById('file-field');
    const formData = new URLSearchParams();
    formData.append('content', ed.value);
    formData.append('file', fileField.value);
    fetch('/profile', { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:formData })
      .then(r => r.text())
      .then(t => {
        document.getElementById('save-status').innerHTML = t;
        // Update lastSavedValue on successful save
        if (t.includes('Saved.')) {
          lastSavedValue = ed.value;
          // Broadcast to other tabs
          profileChannel.postMessage({file: fileField.value, value: ed.value});
        }
      });
  }

  // ─── Live sync: lastSavedValue, BroadcastChannel, SSE, toast ─────────

  // Lock/unlock editor — AI-managed file protection
  function unlockEditor() {
    if (!confirm('This file is auto-generated by AI agents. Manual edits may be overwritten on the next regeneration. Continue?')) return;
    const ed = document.getElementById('editor');
    if (ed) ed.removeAttribute('readonly');
    const banner = document.getElementById('lock-banner');
    if (banner) banner.remove();
    const ff = document.getElementById('file-field');
    if (ff) ff.dataset.locked = '0';
    if (ed) ed.focus();
  }

  let lastSavedValue = (document.getElementById('editor') || {}).value || '';

  // BroadcastChannel — syncs edits across browser tabs on save
  const profileChannel = new BroadcastChannel('profile-sync');
  profileChannel.onmessage = function(ev) {
    const d = ev.data;
    const fileField = document.getElementById('file-field');
    if (!fileField || d.file !== fileField.value) return;
    if (d.value === lastSavedValue) return; // echo of our own save
    const ed = document.getElementById('editor');
    if (!ed) return;
    if (ed.value === lastSavedValue) {
      // No local unsaved edits — safe to auto-apply
      ed.value = d.value;
      lastSavedValue = d.value;
      updateLineNumbers();
      debouncedPreview();
      showToast('Synced', 'Updated from another tab', null);
    } else {
      // Local unsaved edits — toast, never auto-clobber
      showToast('Conflict', 'Another tab saved this file',
        () => { ed.value = d.value; lastSavedValue = d.value; updateLineNumbers(); debouncedPreview(); });
    }
  };

  // SSE listener — profile-changed event from file watcher
  (function() {
    const src = new EventSource('/events');
    src.addEventListener('profile-changed', function(ev) {
      let d;
      try { d = JSON.parse(ev.data); } catch { return; }
      const fileField = document.getElementById('file-field');
      if (!fileField || d.path !== fileField.value) return; // different file changed
      // Fetch the latest content from server
      fetch('/profile/load?file=' + encodeURIComponent(d.path))
        .then(r => r.text())
        .then(html => {
          // Extract content from the fragment (textarea value)
          const m = html.match(/<textarea[^>]*>([\s\S]*?)<\/textarea>/);
          if (!m) return;
          const serverContent = m[1].replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&quot;/g, '"');
          if (serverContent === lastSavedValue) return; // no actual change
          const ed = document.getElementById('editor');
          if (!ed) return;
          if (ed.value === lastSavedValue) {
            // No local unsaved edits — safe to auto-apply
            ed.value = serverContent;
            lastSavedValue = serverContent;
            updateLineNumbers();
            debouncedPreview();
            showToast('Synced', 'File changed on disk', null);
          } else {
            // Local unsaved edits — toast
            showToast('File changed on disk', d.path,
              () => { ed.value = serverContent; lastSavedValue = serverContent; updateLineNumbers(); debouncedPreview(); });
          }
        });
    });
  })();

  // Toast UI — single floating div, replaced in place
  let toastTimer = null;
  function showToast(title, body, onReload) {
    let el = document.getElementById('profile-toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'profile-toast';
      el.style.cssText = 'position:fixed;bottom:1rem;right:1rem;z-index:9999;background:var(--ctp-mantle);border:1px solid var(--border-subtle);border-radius:6px;padding:.6rem .8rem;box-shadow:0 2px 8px rgba(0,0,0,.15);max-width:320px;font-size:.82rem';
      document.body.appendChild(el);
    }
    if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
    let html = `<div style="font-weight:600;margin-bottom:.2rem">${esc(title)}</div><div style="color:var(--text-secondary);margin-bottom:.4rem">${esc(body)}</div>`;
    if (onReload) {
      html += '<div style="display:flex;gap:.4rem"><button onclick="window._toastReload()" style="font-size:.78rem;padding:.15rem .4rem">Reload</button><button onclick="document.getElementById(\'profile-toast\').remove()" class="secondary outline" style="font-size:.78rem;padding:.15rem .4rem">Keep mine</button></div>';
      window._toastReload = onReload;
    }
    el.innerHTML = html;
    if (!onReload) {
      toastTimer = setTimeout(() => { if (el.parentNode) el.remove(); toastTimer = null; }, 3000);
    }
  }

</script>
{% endblock %}
