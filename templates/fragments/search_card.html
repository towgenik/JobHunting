<!-- HTMX polling card for a batch search job.
     Drops hx-trigger when all discovered jobs have reached terminal status. -->
{% if terminal > 0 && terminal == total %}
<article id="search-{{ search_id }}">
  <strong>Search complete</strong> —
  <span>{{ terminal }}/{{ total }} jobs processed</span>
  <span>(<a href="{{ url }}" target="_blank">view listing</a>)</span>
</article>
{% else %}
<article id="search-{{ search_id }}"
         hx-get="/searches/{{ search_id }}/card"
         hx-trigger="every 3s"
         hx-swap="outerHTML">
  <span aria-busy="true">Crawling…</span>
  {% if total > 0 %}
    <span>{{ terminal }}/{{ total }} done</span>
  {% endif %}
  <span>(<a href="{{ url }}" target="_blank">listing</a>)</span>
</article>
{% endif %}
