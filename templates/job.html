{% extends "base.html" %}
{% block content %}
<style>
  main.container { max-width:100%; padding:0; margin:0; display:flex; flex-direction:column; height:100vh }
  nav { padding:.4rem 1rem; flex-shrink:0; border-bottom:1px solid var(--border-subtle) }
  #workspace { flex:1; display:flex; overflow:hidden }
</style>

<div id="job-detail">
{% include "fragments/job_detail.html" %}
</div>
<script>
(function() {
  const jobId = '{{ id }}';
  let timer = null;
  function setup() {
    const src = window.__sse;
    if (!src) { setTimeout(setup, 100); return; }
    src.addEventListener('job-update', function() {
      if (timer) return;
      timer = setTimeout(() => {
        timer = null;
        fetch('/jobs/' + jobId + '/fragment')
          .then(r => r.text())
          .then(html => {
            const el = document.getElementById('job-detail');
            if (el) el.innerHTML = html;
          });
      }, 200);
    });
  }
  setup();
})();
</script>
{% endblock %}
