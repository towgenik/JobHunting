  #   ports: ["3000:3000"]
  #   environment:
  #     - DATABASE_URL=sqlite:///data/jobagent.db
  #     - LLM_ENDPOINT=${LLM_ENDPOINT}
  #     - LLM_API_KEY=${LLM_API_KEY}
  #     - LLM_MODEL=${LLM_MODEL:-claude-sonnet-4-6}
  #     - CDP_URL=http://login:9223
  #     - SESSION_HOST=${SESSION_HOST:-jobstreet.co.id}
  #   volumes:
  #     - app_data:/data         # SQLite + session.json persist here
