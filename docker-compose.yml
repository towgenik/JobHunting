# JobHunting — full-stack deploy artifact (Architecture §9).
# `docker compose up` runs the whole thing on any Linux VM/LXC with Docker.
services:
  login:
    build: ./login
    image: jobhunting/login
    container_name: jobhunting-login
    hostname: login
    restart: unless-stopped
    shm_size: "2g"
    ports:
      - "6901:6901"   # noVNC web UI — a human logs into the job boards here
      - "9223:9223"   # CDP — session.py harvests cookies (host-dev); in-compose the app uses http://login:9223
    environment:
      - VNC_PW=${VNC_PW:-admin1}
      - NO_VNC_PORT=6901
      - KASM_DEBUG=1
      - VNCOPTIONS=-sslOnly 0 -PreferBandwidth -DynamicQualityMin=4 -DynamicQualityMax=7 -DLP_ClipDelay=0
    volumes:
      - chrome_profile:/home/kasm-user

  app:
    build: .
    image: jobhunting/app
    container_name: jobhunting-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Reach host-side services (e.g. the LLM proxy on :20128) from inside the
    # container. host-gateway resolves to the host IP as seen from this network;
    # combined with the UFW allow-rule on 172.16.0.0/12:20128 this lets the app
    # call the proxy via http://host.docker.internal:20128/...
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: ../.env
    environment:
      - DATABASE_URL=sqlite:///data/jobagent.db
      - LLM_ENDPOINT=${LLM_ENDPOINT}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-claude-sonnet-4-6}
      - CDP_URL=http://login:9223
      - SESSION_HOST=${SESSION_HOST:-jobstreet.com}
      - SESSION_FILE=/data/session.json
      - PROFILE_DIR=/profile
    volumes:
      - ./profile:/profile:rw  # source of truth — read by Rust, edited by Claude Code + web GUI
      - app_data:/data         # SQLite + session.json persist here
    depends_on:
      - login

volumes:
  chrome_profile:
  app_data:
