<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="system-ui,sans-serif">
  <rect width="800" height="400" fill="#0d1117"/>
  <!-- Grafana-style dashboard -->
  <text x="24" y="36" fill="#c9d1d9" font-size="16" font-weight="bold">📊 Homelab — System Overview</text>
  <text x="24" y="56" fill="#8b949e" font-size="11">Last 6 hours • auto-refresh 30s</text>

  <!-- CPU panel -->
  <rect x="16" y="72" width="376" height="140" fill="#161b22" rx="6" stroke="#30363d"/>
  <text x="28" y="96" fill="#c9d1d9" font-size="12" font-weight="bold">CPU Usage</text>
  <polyline points="28,170 78,155 128,160 178,140 228,145 278,130 328,135 378,120" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <circle cx="378" cy="120" r="4" fill="#58a6ff"/>
  <text x="320" y="200" fill="#8b949e" font-size="10">avg 23% • max 67% • cores: 4</text>

  <!-- Memory panel -->
  <rect x="408" y="72" width="376" height="140" fill="#161b22" rx="6" stroke="#30363d"/>
  <text x="420" y="96" fill="#c9d1d9" font-size="12" font-weight="bold">Memory</text>
  <rect x="420" y="110" width="352" height="20" fill="#21262d" rx="4"/>
  <rect x="420" y="110" width="228" height="20" fill="#3fb950" rx="4"/>
  <text x="440" y="124" fill="#fff" font-size="10" font-weight="bold">5.2 GB / 8 GB (65%)</text>
  <text x="420" y="160" fill="#8b949e" font-size="10">Docker: 14 containers • 3.1 GB</text>
  <text x="420" y="178" fill="#8b949e" font-size="10">System: 2.1 GB • Cache: 1.8 GB</text>

  <!-- Disk panel -->
  <rect x="16" y="224" width="376" height="140" fill="#161b22" rx="6" stroke="#30363d"/>
  <text x="28" y="248" fill="#c9d1d9" font-size="12" font-weight="bold">Disk (NVMe)</text>
  <rect x="28" y="262" width="352" height="20" fill="#21262d" rx="4"/>
  <rect x="28" y="262" width="176" height="20" fill="#d29922" rx="4"/>
  <text x="48" y="276" fill="#fff" font-size="10" font-weight="bold">128 GB / 256 GB (50%)</text>
  <text x="28" y="310" fill="#8b949e" font-size="10">Backups: daily restic → Backblaze B2</text>
  <text x="28" y="328" fill="#8b949e" font-size="10">Last backup: 2026-06-23 03:00 • OK</text>

  <!-- Network panel -->
  <rect x="408" y="224" width="376" height="140" fill="#161b22" rx="6" stroke="#30363d"/>
  <text x="420" y="248" fill="#c9d1d9" font-size="12" font-weight="bold">Services</text>
  <circle cx="432" cy="276" r="5" fill="#3fb950"/>
  <text x="444" y="280" fill="#c9d1d9" font-size="11">jobhunting-app :3000</text>
  <circle cx="432" cy="300" r="5" fill="#3fb950"/>
  <text x="444" y="304" fill="#c9d1d9" font-size="11">caddy-proxy :443</text>
  <circle cx="432" cy="324" r="5" fill="#3fb950"/>
  <text x="444" y="328" fill="#c9d1d9" font-size="11">prometheus :9090</text>
  <circle cx="432" cy="348" r="5" fill="#3fb950"/>
  <text x="444" y="352" fill="#c9d1d9" font-size="11">tailscale • tailnet connected</text>
</svg>
